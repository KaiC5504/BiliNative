name: iOS compile check

# Unsigned simulator build, tests, launch and screenshots. Needs no Apple account.
# The signed device build lives in testflight.yml.

on:
  push:
    paths:
      - "ios/**"
      - "tools/write_app_keys.py"
      - ".github/workflows/ios-compile.yml"
  # A dispatch can narrow the run while debugging: `gh workflow run ios-compile.yml --ref <branch>
  # -f tests=PageReleaseTests -f shots=false` takes about a third of a full run.
  workflow_dispatch:
    inputs:
      tests:
        description: "Only these tests: classes or Class/method, comma-separated (empty runs all)"
        type: string
        default: ""
      shots:
        description: "Take the screenshots (and on main build Release)"
        type: boolean
        default: true
      leaks:
        description: "Run -DemoScreen leak-check and print what a closed page left alive and what holds it"
        type: boolean
        default: false
      runner:
        description: "Runner image: macos-26 (iOS 26 simulators) or xcode-27 (iOS 27, KaiC's phone; GitHub preview)"
        type: choice
        options: [macos-26, xcode-27]
        default: macos-26

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}-${{ inputs.runner || 'macos-26' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    env:
      # main gets everything. Task branches skip what the PC already checks (the BiliCore tests) and the
      # Release build, which main checks before every TestFlight build.
      FULL_RUN: ${{ github.ref == 'refs/heads/main' }}
      SHOTS: ${{ github.event_name != 'workflow_dispatch' || inputs.shots }}
      # Homebrew's self-update took over two minutes before installing XcodeGen.
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version

      - name: Core package tests
        if: env.FULL_RUN == 'true'
        run: swift test --package-path ios/Packages/BiliCore

      # Same step as in testflight.yml. Without the secret (a fork, or before it is set) it prints a notice and
      # the app builds with nil keys; either way the log never shows the values.
      - name: App keys
        env:
          BILI_APP_KEYS: ${{ secrets.BILI_APP_KEYS }}
        run: python3 tools/write_app_keys.py ios/Generated/AppKeys.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd ios && xcodegen generate

      - name: Check compilation conditions
        run: |
          set -e
          conditions() {
            xcodebuild -project ios/BiliNative.xcodeproj -target BiliNative -configuration "$1" -showBuildSettings \
              | grep SWIFT_ACTIVE_COMPILATION_CONDITIONS
          }
          debug=$(conditions Debug); echo "Debug:   $debug"
          release=$(conditions Release); echo "Release: $release"
          echo "$debug" | grep -qw DEBUG
          echo "$debug" | grep -qw DEV_TOOLS
          echo "$release" | grep -qw DEV_TOOLS

      # Booting takes over a minute, so it runs during the app build. Not earlier: it slows everything beside it,
      # and some BiliCore tests are timed.
      - name: Start a simulator
        id: sim
        run: |
          # The newest iOS, on KaiC's phone model when the image has it.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          def version(runtime):
              return [int(n) for n in re.findall(r'\d+', runtime.split('iOS')[-1])]
          runtimes = {r: d for r, d in json.load(sys.stdin)['devices'].items() if 'iOS' in r}
          best = None
          for runtime in sorted(runtimes, key=version):
              phones = [d for d in runtimes[runtime] if 'iPhone' in d['name'] and d['isAvailable']]
              if phones:
                  pick = next((d for d in phones if d['name'] == 'iPhone 17 Pro Max'), phones[-1])
                  best = (pick['udid'], pick['name'], runtime)
          print(best[0])
          print(best[1], best[2], file=sys.stderr)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/BiliNative.xcodeproj \
            -scheme BiliNative \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build-for-testing

      - name: Restore test media
        id: media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/media
          key: test-media-${{ runner.os }}-${{ hashFiles('ios/scripts/make_test_media.py') }}

      - name: Test media
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 ios/scripts/make_test_media.py "$RUNNER_TEMP/media"

      - name: Test on the simulator
        env:
          # xcodebuild hands TEST_RUNNER_-prefixed variables to the tests without the prefix.
          TEST_RUNNER_MEDIA_DIR: ${{ runner.temp }}/media
          ONLY_TESTS: ${{ inputs.tests }}
        run: |
          set -o pipefail
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          only=()
          if [ -n "$ONLY_TESTS" ]; then
            IFS=',' read -ra items <<< "$ONLY_TESTS"
            for item in "${items[@]}"; do
              item=$(echo "$item" | xargs)
              [ -n "$item" ] && only+=("-only-testing:BiliNativeTests/$item")
            done
          fi
          xcodebuild \
            -project ios/BiliNative.xcodeproj \
            -scheme BiliNative \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            "${only[@]}" \
            test-without-building

      # Opens a video page, goes back, and prints what of it is still alive and the chain of references that holds
      # it (LeakCheckDemo, HeapReferrers). macOS `leaks` cannot read simulator processes on the runner ("Failed to
      # get DYLD info"), so the app scans its own heap.
      - name: Leak check
        if: always() && inputs.leaks
        env:
          SIMCTL_CHILD_MEDIA_DIR: ${{ runner.temp }}/media
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=com.kaichuan.bilifast
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BiliNative.app
          xcrun simctl terminate "$UDID" $APP 2>/dev/null || true
          DATA=$(xcrun simctl get_app_container "$UDID" $APP data)
          rm -f "$DATA/Documents/leak-check.txt" "$DATA/Documents/leak-report.txt"
          xcrun simctl launch "$UDID" $APP -DemoData YES -DemoScreen leak-check
          for i in $(seq 1 180); do [ -f "$DATA/Documents/leak-check.txt" ] && break; sleep 1; done
          echo "--- still alive after the page closed:"
          cat "$DATA/Documents/leak-check.txt" || { echo "no leak-check file"; exit 0; }
          echo "--- who holds the page:"
          for i in $(seq 1 300); do [ -f "$DATA/Documents/leak-report.txt" ] && break; sleep 1; done
          cat "$DATA/Documents/leak-report.txt" || true

      # The screenshots mostly wait, so the Release build compiles alongside them.
      - name: Start the Release build
        if: env.FULL_RUN == 'true' && env.SHOTS == 'true'
        run: |
          (
            xcodebuild \
              -project ios/BiliNative.xcodeproj \
              -scheme BiliNative \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -configuration Release \
              -derivedDataPath build-release \
              CODE_SIGNING_ALLOWED=NO \
              build > "$RUNNER_TEMP/release.log" 2>&1
            echo $? > "$RUNNER_TEMP/release.exit"
          ) &

      - name: Install, launch and screenshot
        if: env.SHOTS == 'true'
        env:
          # simctl hands SIMCTL_CHILD_-prefixed variables to the launched app without the prefix.
          SIMCTL_CHILD_MEDIA_DIR: ${{ runner.temp }}/media
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=com.kaichuan.bilifast
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BiliNative.app
          mkdir -p shots
          xcrun simctl launch "$UDID" $APP
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/01-first-launch.png
          shoot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" $APP || true
            xcrun simctl launch "$UDID" $APP "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shoot 02-settings 8 -DemoScreen settings
          shoot 00-demo-home 5 -DemoData YES
          shoot home-menu 5 -DemoData YES -DemoScreen home-menu
          shoot history 6 -DemoData YES -DemoScreen history
          shoot 03-page 10 -DemoData YES -DemoScreen page
          shoot 22-danmaku-send 12 -DemoData YES -DemoScreen danmaku-send
          shoot 23-danmaku-style 12 -DemoData YES -DemoScreen danmaku-style
          shoot danmaku-portrait 14 -DemoData YES -DemoScreen danmaku-portrait -DemoPauseAt 26
          shoot danmaku-landscape 14 -DemoData YES -DemoScreen danmaku-landscape -DemoPauseAt 26
          shoot 11-panel-quality 16 -DemoData YES -DemoScreen page -DemoPanel quality
          shoot 11-panel-speed 16 -DemoData YES -DemoScreen page -DemoPanel speed
          shoot 11-panel-more 16 -DemoData YES -DemoScreen page -DemoPanel more
          shoot 11-panel-more-portrait 12 -DemoData YES -DemoScreen page -DemoPanel more -DemoPortrait YES
          shoot 04-player-portrait 12 -DemoData YES -DemoScreen player-portrait
          shoot 05-player-landscape 12 -DemoData YES -DemoScreen player-landscape
          shoot 06-player-vertical 12 -DemoData YES -DemoScreen player-vertical
          shoot 07-hud-speed 9 -DemoData YES -DemoScreen hud-speed
          shoot 08-end-portrait 12 -DemoData YES -DemoScreen end-portrait
          shoot 09-end-landscape 12 -DemoData YES -DemoScreen end-landscape
          shoot panel-danmaku 16 -DemoData YES -DemoScreen page -DemoPanel danmaku
          shoot panel-danmaku-more 16 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoDanmakuMore YES
          shoot block-words 16 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoBlockWords YES
          shoot panel-danmaku-portrait 12 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoPortrait YES
          shoot block-words-portrait 12 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoPortrait YES -DemoBlockWords YES
          shoot page-intro 12 -DemoData YES -DemoScreen page-intro
          shoot page-intro-expanded 12 -DemoData YES -DemoScreen page-intro-expanded
          shoot sheet-collection 13 -DemoData YES -DemoScreen sheet-collection
          shoot page-collapsed 13 -DemoData YES -DemoScreen page-collapsed
          shoot danmaku-send-inline 12 -DemoData YES -DemoScreen danmaku-send-inline
          shoot comments 12 -DemoData YES -DemoScreen comments
          shoot comments-thread 13 -DemoData YES -DemoScreen comments-thread
          shoot picture-viewer 12 -DemoData YES -DemoScreen picture-viewer
          shoot page-actions-active 11 -DemoData YES -DemoScreen page-actions-active
          shoot player-landscape-actions 12 -DemoData YES -DemoScreen player-landscape-actions
          shoot coin-dialog 11 -DemoData YES -DemoScreen coin-dialog
          shoot favourite-sheet 11 -DemoData YES -DemoScreen favourite-sheet
          shoot composer-emotes 15 -DemoData YES -DemoScreen composer-emotes

      - name: Release build (no tests)
        if: env.FULL_RUN == 'true' && env.SHOTS == 'true'
        run: |
          while [ ! -f "$RUNNER_TEMP/release.exit" ]; do sleep 5; done
          status=$(cat "$RUNNER_TEMP/release.exit")
          if [ "$status" != 0 ]; then
            grep -E "error:|BUILD FAILED" "$RUNNER_TEMP/release.log" | head -60
            tail -20 "$RUNNER_TEMP/release.log"
            exit "$status"
          fi
          tail -3 "$RUNNER_TEMP/release.log"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name "BiliNative*" -exec cp {} shots/crashes/ \; 2>/dev/null || true
          if [ -n "$(ls -A shots/crashes 2>/dev/null)" ]; then
            echo "CRASHES FOUND:"; head -60 shots/crashes/* || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-screenshots
          path: shots/
