name: iOS compile check

# Unsigned simulator build, tests, launch and screenshots. Needs no Apple account.
# The signed device build lives in testflight.yml.

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      # main and m2 get everything. Task branches skip what the PC already checks (the BiliCore tests) and the
      # Release build, which main checks before every TestFlight build.
      FULL_RUN: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/m2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version

      - name: Core package tests
        if: env.FULL_RUN == 'true'
        run: swift test --package-path ios/Packages/BiliCore

      # Booting takes over a minute, so it runs during the app build. Not earlier: it would slow the BiliCore
      # tests, some of which are timed.
      - name: Start a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          best = None
          for runtime, items in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for device in items:
                  if 'iPhone' in device['name'] and device['isAvailable']:
                      best = device['udid']
          print(best)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd ios && xcodegen generate

      - name: Check compilation conditions
        run: |
          set -e
          conditions() {
            xcodebuild -project ios/BiliNative.xcodeproj -target BiliNative -configuration "$1" -showBuildSettings \
              | grep SWIFT_ACTIVE_COMPILATION_CONDITIONS
          }
          debug=$(conditions Debug); echo "Debug:   $debug"
          release=$(conditions Release); echo "Release: $release"
          echo "$debug" | grep -qw DEBUG
          echo "$debug" | grep -qw DEV_TOOLS
          echo "$release" | grep -qw DEV_TOOLS

      # Xcode's compilation cache is keyed by content, not file times, so a fresh checkout can reuse it.
      - name: Restore the compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xcode-cas
          key: xcode-cas-${{ runner.os }}-${{ github.sha }}
          restore-keys: xcode-cas-${{ runner.os }}-

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/BiliNative.xcodeproj \
            -scheme BiliNative \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/xcode-cas" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build-for-testing

      - name: Restore test media
        id: media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/media
          key: test-media-${{ runner.os }}-${{ hashFiles('ios/scripts/make_test_media.py') }}

      - name: Test media
        if: steps.media.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 ios/scripts/make_test_media.py "$RUNNER_TEMP/media"

      - name: Test on the simulator
        env:
          # xcodebuild hands TEST_RUNNER_-prefixed variables to the tests without the prefix.
          TEST_RUNNER_MEDIA_DIR: ${{ runner.temp }}/media
        run: |
          set -o pipefail
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcodebuild \
            -project ios/BiliNative.xcodeproj \
            -scheme BiliNative \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            test-without-building

      # The screenshots mostly wait, so the Release build compiles alongside them.
      - name: Start the Release build
        if: env.FULL_RUN == 'true'
        run: |
          (
            xcodebuild \
              -project ios/BiliNative.xcodeproj \
              -scheme BiliNative \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -configuration Release \
              -derivedDataPath build-release \
              CODE_SIGNING_ALLOWED=NO \
              build > "$RUNNER_TEMP/release.log" 2>&1
            echo $? > "$RUNNER_TEMP/release.exit"
          ) &

      - name: Install, launch and screenshot
        env:
          # simctl hands SIMCTL_CHILD_-prefixed variables to the launched app without the prefix.
          SIMCTL_CHILD_MEDIA_DIR: ${{ runner.temp }}/media
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=com.kaichuan.bilifast
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BiliNative.app
          mkdir -p shots
          xcrun simctl launch "$UDID" $APP
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/01-first-launch.png
          shoot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" $APP || true
            xcrun simctl launch "$UDID" $APP "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shoot 02-settings 8 -DemoScreen settings
          shoot 00-demo-home 8 -DemoData YES
          shoot 03-page 10 -DemoData YES -DemoScreen page
          shoot 22-danmaku-send 12 -DemoData YES -DemoScreen danmaku-send
          shoot 23-danmaku-style 12 -DemoData YES -DemoScreen danmaku-style
          shoot danmaku-portrait 14 -DemoData YES -DemoScreen danmaku-portrait -DemoPauseAt 26
          shoot danmaku-landscape 14 -DemoData YES -DemoScreen danmaku-landscape -DemoPauseAt 26
          shoot 11-panel-quality 16 -DemoData YES -DemoScreen page -DemoPanel quality
          shoot 11-panel-speed 16 -DemoData YES -DemoScreen page -DemoPanel speed
          shoot 11-panel-more 16 -DemoData YES -DemoScreen page -DemoPanel more
          shoot 11-panel-more-portrait 12 -DemoData YES -DemoScreen page -DemoPanel more -DemoPortrait YES
          shoot 04-player-portrait 12 -DemoData YES -DemoScreen player-portrait
          shoot 05-player-landscape 12 -DemoData YES -DemoScreen player-landscape
          shoot 06-player-vertical 12 -DemoData YES -DemoScreen player-vertical
          shoot 07-hud-speed 9 -DemoData YES -DemoScreen hud-speed
          shoot 08-end-portrait 12 -DemoData YES -DemoScreen end-portrait
          shoot 09-end-landscape 12 -DemoData YES -DemoScreen end-landscape
          shoot panel-danmaku 16 -DemoData YES -DemoScreen page -DemoPanel danmaku
          shoot panel-danmaku-more 16 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoDanmakuMore YES
          shoot block-words 16 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoBlockWords YES
          shoot panel-danmaku-portrait 12 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoPortrait YES
          shoot block-words-portrait 12 -DemoData YES -DemoScreen page -DemoPanel danmaku -DemoPortrait YES -DemoBlockWords YES

      - name: Release build (no tests)
        if: env.FULL_RUN == 'true'
        run: |
          while [ ! -f "$RUNNER_TEMP/release.exit" ]; do sleep 5; done
          status=$(cat "$RUNNER_TEMP/release.exit")
          if [ "$status" != 0 ]; then
            grep -E "error:|BUILD FAILED" "$RUNNER_TEMP/release.log" | head -60
            tail -20 "$RUNNER_TEMP/release.log"
            exit "$status"
          fi
          tail -3 "$RUNNER_TEMP/release.log"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name "BiliNative*" -exec cp {} shots/crashes/ \; 2>/dev/null || true
          if [ -n "$(ls -A shots/crashes 2>/dev/null)" ]; then
            echo "CRASHES FOUND:"; head -60 shots/crashes/* || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-screenshots
          path: shots/
